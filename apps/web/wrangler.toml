name = "notion-glaze-landing"
compatibility_date = "2025-02-15"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "./dist"

[[d1_databases]]
binding = "DB"
database_name = "notion-glaze-db"
database_id = "0f179af5-16fa-4627-8ad6-ecdf8d50707d"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "notionglaze-assets"

[[services]]
binding = "SYNC_WORKER"
service = "notion-glaze-sync-worker"

